<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Issues | Smart Hostel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        /* Specific Styles for the Issues Table */
        .issues-container {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 16px;
            border-bottom: 2px solid #f1f5f9;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 18px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        /* Status Badge Styling */
        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-reported { background: #f1f5f9; color: #475569; }
        .status-assigned { background: #e0e7ff; color: #4338ca; }
        .status-inprogress { background: #ffedd5; color: #9a3412; }
        .status-resolved { background: #dcfce7; color: #15803d; }
        .status-closed { background: #334155; color: #f8fafc; }

        .priority-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .prio-High, .prio-Emergency { background: #ef4444; }
        .prio-Medium { background: #f59e0b; }
        .prio-Low { background: #10b981; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: #e2e8f0;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .issues-container { padding: 15px; }
            th { display: none; }
            td { display: block; border: none; padding: 8px 0; }
            td:first-child { font-weight: 700; font-size: 1.1rem; padding-top: 15px; }
            tr { border-bottom: 2px solid #f1f5f9; display: block; padding-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Smart<span>Hostel</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="report-issue.html"><i class="fas fa-plus-circle"></i> Report Issue</a>
                <a href="my-issues.html" class="active"><i class="fas fa-list-ul"></i> My Issues</a>
                <a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a>
                <a href="lost-found.html"><i class="fas fa-search"></i> Lost & Found</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-header">
                <div class="welcome-text">
                    <a href="dashboard.html" class="back-btn" style="text-decoration: none; color: var(--primary); font-weight: 600;">
                        <i class="fas fa-arrow-left"></i> Dashboard
                    </a>
                    <h1 style="margin-top: 10px;">Track My Issues</h1>
                </div>
            </div>

            <div class="issues-container">
                <div class="table-header">
                    <h2>History</h2>
                    <span id="issueCount" class="badge status-assigned">0 Issues</span>
                </div>

                <div id="issuesList">
                    </div>
            </div>
        </main>
    </div>

    <script src="../js/student.js"></script>
</body>
</html>
