<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Smart Hostel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Smart<span>Hostel</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="report-issue.html"><i class="fas fa-plus-circle"></i> Report Issue</a>
                <a href="my-issues.html"><i class="fas fa-list-ul"></i> My Issues</a>
                <a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a>
                <a href="lost-found.html"><i class="fas fa-search"></i> Lost & Found</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <h1>Welcome back, <span id="studentNameDisplay">Student</span>!</h1>
                    <p>Here's what's happening in your hostel today.</p>
                </div>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Student&background=4f46e5&color=fff" alt="Avatar" id="userAvatar">
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-clipboard-list"></i></div>
                    <div class="stat-info">
                        <h3>Total Issues</h3>
                        <p class="stat-value">12</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
                    <div class="stat-info">
                        <h3>Pending</h3>
                        <p class="stat-value">03</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-info">
                        <h3>Resolved</h3>
                        <p class="stat-value">09</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fas fa-bell"></i></div>
                    <div class="stat-info">
                        <h3>Announcements</h3>
                        <p class="stat-value">05</p>
                    </div>
                </div>
            </section>

            <section class="quick-actions">
                <h2>Quick Actions</h2>
                <div class="action-buttons">
                    <a href="report-issue.html" class="action-btn primary">
                        <i class="fas fa-pen"></i> Report New Issue
                    </a>
                    <a href="my-issues.html" class="action-btn secondary">
                        <i class="fas fa-eye"></i> View My Issues
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/student.js"></script>
</body>
</html>
