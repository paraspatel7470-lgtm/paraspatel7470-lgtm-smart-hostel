<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Smart Hostel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .announcement-feed {
            max-width: 900px;
            margin: 0 auto;
        }

        .announcement-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-left: 5px solid var(--primary);
            transition: transform 0.2s ease;
        }

        .announcement-card:hover {
            transform: translateX(5px);
        }

        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .announcement-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .announcement-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .meta-item {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .announcement-body {
            line-height: 1.6;
            color: #475569;
            font-size: 0.95rem;
        }

        /* Category Specific Colors */
        .border-Maintenance { border-left-color: #f59e0b; }
        .border-Water { border-left-color: #3b82f6; }
        .border-Electricity { border-left-color: #ef4444; }
        .border-Cleaning { border-left-color: #10b981; }
        .border-General { border-left-color: var(--primary); }

        .empty-announcements {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Smart<span>Hostel</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="report-issue.html"><i class="fas fa-plus-circle"></i> Report Issue</a>
                <a href="my-issues.html"><i class="fas fa-list-ul"></i> My Issues</a>
                <a href="announcements.html" class="active"><i class="fas fa-bullhorn"></i> Announcements</a>
                <a href="lost-found.html"><i class="fas fa-search"></i> Lost & Found</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <a href="dashboard.html" class="back-btn" style="text-decoration: none; color: var(--primary); font-weight: 600;">
                        <i class="fas fa-arrow-left"></i> Dashboard
                    </a>
                    <h1 style="margin-top: 10px;">Notice Board</h1>
                    <p>Stay updated with the latest hostel news and schedules.</p>
                </div>
            </header>

            <div id="announcementsContainer" class="announcement-feed">
                </div>
        </main>
    </div>

    <script src="../js/student.js"></script>
</body>
</html>
