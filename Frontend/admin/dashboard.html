<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Smart Hostel Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-logo">
                <h2>Hostel<span>Admin</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="manage-issues.html"><i class="fas fa-tasks"></i> Manage Issues</a>
                <a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a>
                <a href="analytics.html"><i class="fas fa-pie-chart"></i> Analytics</a>
            </nav>
            <div class="sidebar-footer">
                <button id="adminLogoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <h1>Management Overview</h1>
                    <p>Welcome, <span id="adminName">Warden Smith</span></p>
                </div>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=1e293b&color=fff" alt="Admin Avatar">
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-inbox"></i></div>
                    <div class="stat-info">
                        <h3>Total Reports</h3>
                        <p id="countTotal" class="stat-value">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange"><i class="fas fa-exclamation-circle"></i></div>
                    <div class="stat-info">
                        <h3>Open Issues</h3>
                        <p id="countPending" class="stat-value">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-check-double"></i></div>
                    <div class="stat-info">
                        <h3>Resolved</h3>
                        <p id="countResolved" class="stat-value">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fas fa-megaphone"></i></div>
                    <div class="stat-info">
                        <h3>Active Notices</h3>
                        <p id="countAnnounce" class="stat-value">0</p>
                    </div>
                </div>
            </section>

            <section class="quick-actions">
                <h2>Administrative Tasks</h2>
                <div class="action-buttons">
                    <a href="manage-issues.html" class="action-btn primary">
                        <i class="fas fa-list-check"></i> View All Issues
                    </a>
                    <a href="announcements.html" class="action-btn secondary">
                        <i class="fas fa-plus"></i> Create Announcement
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
