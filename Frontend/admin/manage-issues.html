<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Issues | Admin Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        /* Admin Table Specific Styling */
        .manage-card {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px; /* Ensures table doesn't cramp */
        }

        .admin-table th {
            text-align: left;
            padding: 16px;
            background: #f8fafc;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #edf2f7;
        }

        .admin-table td {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        /* Status Select Styling */
        .status-select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .status-select:focus { border-color: var(--primary); }

        /* Status colors */
        .status-reported { background: #f1f5f9; color: #475569; }
        .status-assigned { background: #e0e7ff; color: #4338ca; }
        .status-inprogress { background: #ffedd5; color: #9a3412; }
        .status-resolved { background: #dcfce7; color: #15803d; }
        .status-closed { background: #334155; color: #f8fafc; }

        .priority-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .prio-High, .prio-Emergency { background: #fee2e2; color: #ef4444; }
        .prio-Medium { background: #fef3c7; color: #d97706; }
        .prio-Low { background: #dcfce7; color: #166534; }

        .assign-input {
            width: 120px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-logo"><h2>Hostel<span>Admin</span></h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="manage-issues.html" class="active"><i class="fas fa-tasks"></i> Manage Issues</a>
                <a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a>
                <a href="analytics.html"><i class="fas fa-pie-chart"></i> Analytics</a>
            </nav>
            <div class="sidebar-footer">
                <button id="adminLogoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <a href="dashboard.html" class="back-btn" style="text-decoration:none; color:var(--primary); font-weight:600;">
                        <i class="fas fa-arrow-left"></i> Dashboard Overview
                    </a>
                    <h1 style="margin-top:10px;">Issue Resolution Center</h1>
                    <p>Track, assign, and resolve student complaints across all blocks.</p>
                </div>
            </header>

            <div class="manage-card">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Issue ID</th>
                            <th>Student & Title</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Assign To</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody id="adminIssuesTableBody">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
