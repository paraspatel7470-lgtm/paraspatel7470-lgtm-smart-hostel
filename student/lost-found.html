<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found | Smart Hostel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .lf-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            align-items: start;
        }

        /* Form Styling */
        .lf-form-card {
            background: var(--white);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            position: sticky;
            top: 40px;
        }

        .lf-form-card h2 { margin-bottom: 20px; font-size: 1.2rem; color: var(--text-dark); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid #e2e8f0; font-size: 0.9rem;
        }

        .type-toggle { display: flex; gap: 10px; margin: 10px 0; }
        .type-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1.5px solid #e2e8f0; cursor: pointer; text-align: center; font-weight: 600; transition: 0.2s; }
        input[name="itemType"] { display: none; }
        input[value="Lost"]:checked + .type-btn { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        input[value="Found"]:checked + .type-btn { background: #dcfce7; border-color: #22c55e; color: #166534; }

        .submit-lf { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
        }

        .item-img {
            width: 100%;
            height: 180px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            object-fit: cover;
        }

        .item-details { padding: 20px; }
        .item-badge { padding: 4px 10px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        .badge-lost { background: #fee2e2; color: #ef4444; }
        .badge-found { background: #dcfce7; color: #166534; }

        .item-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; display: block; }
        .item-loc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }

        @media (max-width: 992px) {
            .lf-layout { grid-template-columns: 1fr; }
            .lf-form-card { position: static; }
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo"><h2>Smart<span>Hostel</span></h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="report-issue.html"><i class="fas fa-plus-circle"></i> Report Issue</a>
                <a href="my-issues.html"><i class="fas fa-list-ul"></i> My Issues</a>
                <a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a>
                <a href="lost-found.html" class="active"><i class="fas fa-search"></i> Lost & Found</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <a href="dashboard.html" class="back-btn" style="text-decoration:none; color:var(--primary); font-weight:600;">
                        <i class="fas fa-arrow-left"></i> Dashboard
                    </a>
                    <h1 style="margin-top:10px;">Lost & Found Hub</h1>
                    <p>Help your fellow residents by reporting found items or recovering yours.</p>
                </div>
            </header>

            <div class="lf-layout">
                <section class="lf-form-card">
                    <h2>Report Item</h2>
                    <form id="lfForm">
                        <div class="type-toggle">
                            <label>
                                <input type="radio" name="itemType" value="Lost" checked>
                                <div class="type-btn">Lost</div>
                            </label>
                            <label>
                                <input type="radio" name="itemType" value="Found">
                                <div class="type-btn">Found</div>
                            </label>
                        </div>
                        <div class="form-group">
                            <label>Item Name</label>
                            <input type="text" id="itemName" placeholder="e.g. Blue Wallet" required>
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" id="itemLoc" placeholder="e.g. Mess Hall" required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="itemDesc" rows="3" placeholder="Any identifying marks?"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="itemDate" required>
                        </div>
                        <button type="submit" class="submit-lf">Post Record</button>
                    </form>
                </section>

                <section id="lfItemsContainer" class="items-grid">
                    </section>
            </div>
        </main>
    </div>

    <script src="../js/student.js"></script>
</body>
</html>
